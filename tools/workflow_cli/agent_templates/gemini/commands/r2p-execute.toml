description = "Execute a closed run's PLAN in place on the current branch via the subagent-driven SDD loop, then archive. Strict is the default; fast is explicit opt-in through the read-only preflight/eligibility handshake and must fail closed or escalate one-way to strict on any risk trigger. Fast uses fresh implementers plus a primary final task-by-task review, never synthetic task reviewers; final review always runs the full suite and archive gates remain unchanged. Task roles use r2p-context-view themselves for semantic_view/semantic_payload_bytes and default to targeted/directly affected verification. Every role needs a new zero-history subagent session; Gemini only forwards the wrapper, so fail closed if the host cannot provide that isolation and must not claim unavailable subagent capability. A capable host calls r2p-progress begin before each role and r2p-progress complete after its durable report; follow the returned role_sequence/next_role and recover_role_result without automatic redispatch. Original task ranges stay fixed; use each review_ranges entry including owned repairs. Escalation after fast final findings uses the progress command's reason. Resolve BLOCKED before retrying the same role with a new sequence. Call r2p-metrics-status on start/resume, r2p-metrics-append then r2p-metrics-ack after authoritative completion, and r2p-metrics-finalize after approval. Preserve blocked attempts and TDD red; latest final verification outcomes must pass. Metrics failures are metrics_incomplete, never progress/resume/archive gates or complete measurement evidence. Metrics are controller-owned and non-authoritative."
prompt = "!{\"{{R2P_BIN_DIR}}/r2p-execute\" {{args}}}"
