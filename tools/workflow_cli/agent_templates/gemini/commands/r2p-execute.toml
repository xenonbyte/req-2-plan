description = "Execute a closed run's PLAN in place on the current branch via the subagent-driven SDD loop, then archive. Strict is the default; fast is explicit opt-in through the read-only preflight/eligibility handshake and must fail closed or escalate one-way to strict on any risk trigger. Fast uses fresh implementers plus a primary final task-by-task review, never synthetic task reviewers; final review always runs the full suite and archive gates remain unchanged. Task roles use r2p-context-view themselves for semantic_view/semantic_payload_bytes and default to targeted/directly affected verification. Every role needs a new zero-history subagent session; Gemini only forwards the wrapper, so fail closed if the host cannot provide that isolation and must not claim unavailable subagent capability. A capable host must call r2p-metrics-status on start/resume, r2p-metrics-append after every actual role, and r2p-metrics-finalize after approval; otherwise report metrics_incomplete and do not claim completion. Metrics are controller-owned and non-authoritative."
prompt = "!{\"{{R2P_BIN_DIR}}/r2p-execute\" {{args}}}"
