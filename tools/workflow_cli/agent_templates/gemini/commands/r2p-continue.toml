description = "Continue the active requirement-to-PLAN workflow run. At checkpoints, only approve DESIGN/SPEC/PLAN artifacts with no unresolved ambiguity or undecided point. A decomposition stage may not defer or drop requirement content: everything the brief puts in scope must be implemented this run. When authoring or repairing a PLAN, form a phase-level cohesive slice around one observable behavior or contract result. If it needs both create and modify paths, R19 requires an operation-homogeneous task group: each task has operation-homogeneous Files and a directly testable intermediate contract; the final integration/adoption task runs Phase acceptance. Do not split by file/class alone, create a wrapper before its target, or merge unrelated behavior into a mega-task. The first semantic Steps line is exactly Prerequisite: none or Prerequisite: PLAN-TASK-NNN. Declare only direct predecessors in that task group; cross-Phase order follows PLAN order and prior Phase acceptance, not the rollback graph. Roll back one task after its group's declared dependents, or a whole group in reverse topological order without touching another Phase. Do not add a Dependencies: field. Every generated v2 PLAN exposes that first Steps line to the execution controller as a dispatch prerequisite gate using profile-aware prerequisite semantics; it must not be copied into `Verification` or rerun by a reviewer after implementation. Existing generated v1 PLAN invocations remain compatible."
prompt = "!{\"{{R2P_BIN_DIR}}/r2p-continue\" {{args}}}"
